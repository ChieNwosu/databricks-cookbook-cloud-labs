name: validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Check generated docs
        run: python scripts/generate_docs.py --check
      - name: Lint notebooks
        run: python scripts/lint_notebooks.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
